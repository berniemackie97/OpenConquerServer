name: Epic
description: "Track a multi-issue delivery outcome and release exit gates."
title: "[Epic] "
labels: ["type:epic"]
projects: ["berniemackie97/5"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: "Outcome"
      description: "The product capability or release result that can be observed."
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: "Scope and dependencies"
      description: "Linked child issues, blocked prerequisites and excluded work."
    validations:
      required: true
  - type: textarea
    id: exit
    attributes:
      label: "Exit criteria"
      description: "Verifiable product and engineering acceptance; identify real-device or external gates."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Evidence and remaining risks"
      description: "Sources for behavior contracts, security/performance concerns and unverified assumptions."
    validations:
      required: false
