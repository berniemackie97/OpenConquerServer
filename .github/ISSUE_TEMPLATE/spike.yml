name: Spike
description: "Answer a bounded research question before committing to a design."
title: "[Spike] "
labels: ["type:spike"]
projects: ["berniemackie97/5"]
body:
  - type: textarea
    id: question
    attributes:
      label: "Decision or behavior to prove"
      description: "What is unknown and why it blocks downstream work."
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: "Evidence sources and verification"
      description: "Original executable, controlled probes, notes or experiments to examine."
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: "Required finding"
      description: "Exact observations, counterexamples, source references and remaining unknowns."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: "Downstream issue and constraints"
      description: "Linked blocked tasks and any tools or assets not currently available."
    validations:
      required: false
